syntax = "proto3";

package incident.v1;

option go_package = "watchtower/proto/gen/incident/v1;incidentv1";

message Incident {
  string id = 1;
  string title = 2;
  string severity = 3;
  string status = 4;
  string details = 5; // JSON string of the raw alert
  string assignee_id = 6;
  repeated Comment comments = 7;
}

message ListIncidentsRequest {
  int32 limit = 1; // optional, server default 50
  string status = 2; // optional filter
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
}

message CreateIncidentRequest {
  string title = 1;
  string severity = 2;
  string details = 3;
}

message GetIncidentRequest {
  string id = 1;
}

message AddCommentRequest {
  string incident_id = 1;
  string text = 2;
  string author_id = 3;
}

message Comment {
  string id = 1;
  string text = 2;
  string author_id = 3;
  string created_at = 4;
}

message AcknowledgeIncidentRequest {
  string incident_id = 1;
}

service IncidentService {
  rpc ListIncidents (ListIncidentsRequest) returns (ListIncidentsResponse);
  rpc GetIncident (GetIncidentRequest) returns (Incident);
  rpc CreateIncident (CreateIncidentRequest) returns (Incident);
  rpc AcknowledgeIncident (AcknowledgeIncidentRequest) returns (Incident);
  rpc AddComment (AddCommentRequest) returns (Comment);
}
