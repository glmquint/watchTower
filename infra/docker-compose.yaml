version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
      POSTGRES_DB: watchtower
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchtower -d watchtower"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  auth-service:
    build: ../services/auth-service
    container_name: wt_auth_service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: watchtower
      DB_PASSWORD: watchtower
      DB_NAME: watchtower
      JWT_SECRET: dev-secret-change
    depends_on:
      - postgres
    ports:
      - "50051:50051"

  incident-service:
    build: ../services/incident-service
    container_name: wt_incident_service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: watchtower
      DB_PASSWORD: watchtower
      DB_NAME: watchtower
      REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "50052:50052"

volumes:
  pgdata:
  redisdata:
